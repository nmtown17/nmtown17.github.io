  <style>
    .hsj-detail-section{background:#050509;padding:40px 0;}
    .hsj-detail-wrap{max-width:960px;margin:0 auto;padding:28px 20px 40px;background:radial-gradient(circle at top,#1f1f27 0%,#050509 55%);box-shadow:0 18px 40px rgba(0,0,0,0.7);color:#f5f5f5;font-family:'Noto Sans KR',sans-serif;}
    .hsj-detail-header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
    .hsj-detail-title{font-size:32px;font-weight:800;letter-spacing:0.04em;}
    .hsj-lang-switch{display:flex;flex-wrap:wrap;gap:6px;}
    .hsj-lang-switch button{border:1px solid rgba(255,255,255,0.2);padding:6px 14px;border-radius:0;font-size:13px;cursor:pointer;color:#f9fafb;opacity:0.95;transition:all 0.18s ease;white-space:nowrap;position:relative;overflow:hidden;background:transparent;}
    .hsj-lang-ko{background:#c8a15a;}
    .hsj-lang-en{background:#3b82f6;}
    .hsj-lang-jp{background:#a855f7;}
    .hsj-lang-ch{background:#ef4444;}
    .hsj-lang-bt{background:#10b981;}
    .hsj-lang-switch button::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,0.18),transparent 55%);opacity:0;transform:translateX(-40%);transition:all 0.22s ease;}
    .hsj-lang-switch button:hover{transform:translateY(-1px);}
    .hsj-lang-switch button:hover::after{opacity:1;transform:translateX(0);}
    .hsj-lang-switch button.active{background:#111827;border-color:#e5e7eb;box-shadow:0 0 0 1px rgba(255,255,255,0.35);opacity:1;}
    .hsj-detail-menu{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;border-bottom:1px solid rgba(255,255,255,0.08);padding-bottom:10px;}
    .hsj-detail-menu button{border-radius:0;border:1px solid rgba(255,255,255,0.25);background:transparent;padding:6px 14px;font-size:13px;cursor:pointer;color:#e5e5e5;transition:all 0.18s ease;white-space:nowrap;}
    .hsj-detail-menu button:hover{background:rgba(255,255,255,0.04);}
    .hsj-detail-menu button.active{background:#c8a15a;color:#111827;border-color:#c8a15a;}
    .hsj-detail-images{max-width:800px;margin:0 auto;}
    .hsj-detail-images img{width:100%;display:block;border-radius:0;margin-bottom:0;box-shadow:none;}
    @media (max-width:768px){.hsj-detail-wrap{padding:20px 14px 32px;}.hsj-detail-title{font-size:26px;}}
  </style>
</head>
<body>

  <div class="hsj-detail-section">
    <div class="hsj-detail-wrap">
      <div class="hsj-detail-header">
        <h1 class="hsj-detail-title">하심정 신상품 소개</h1>
        <div class="hsj-lang-switch">
          <button type="button" class="hsj-lang-ko active" data-lang="ko">한국어</button>
          <button type="button" class="hsj-lang-en" data-lang="en">영어</button>
          <button type="button" class="hsj-lang-jp" data-lang="jp">일본어</button>
          <button type="button" class="hsj-lang-ch" data-lang="ch">중국어</button>
          <button type="button" class="hsj-lang-bt" data-lang="bt">베트남어</button>
        </div>
      </div>

      <div class="hsj-detail-menu">
        <button type="button" data-code="a1" class="active">1. 흑더덕 농축액 스틱</button>
        <button type="button" data-code="a2">2. 흑도라지 농축액 스틱</button>
        <button type="button" data-code="a3">3. 횡성 더덕 순액99.9</button>
        <button type="button" data-code="a4">4. 구증구포발효커피</button>
      </div>

      <div id="hsjDetailImages" class="hsj-detail-images">
        <!-- 이미지 세트가 여기 들어감 -->
      </div>
    </div>
  </div>

  <script>
    (function(){
      var basePath='https://hasimjeong.cafe24.com/web/upload/wdi_img/item/';
      var imageInfo={a1:8,a2:9,a3:7,a4:8};
      var imagesContainer=document.getElementById('hsjDetailImages');
      var productButtons=document.querySelectorAll('.hsj-detail-menu button');
      var langButtons=document.querySelectorAll('.hsj-lang-switch button');
      var currentCode='a1';
      var currentLang='ko';

      function pad2(num){return(num<10?'0':'')+num;}

      function renderImages(code,lang){
        var count=imageInfo[code]||0;
        var html='';
        for(var i=1;i<=count;i++){
          var fileName=code+'_'+pad2(i)+'.jpg';
          var src=basePath+lang+'/'+fileName;
          html+='<img src="'+src+'" alt="">';
        }
        imagesContainer.innerHTML=html;
      }

      productButtons.forEach(function(btn){
        btn.addEventListener('click',function(){
          productButtons.forEach(function(b){b.classList.remove('active');});
          this.classList.add('active');
          currentCode=this.getAttribute('data-code');
          renderImages(currentCode,currentLang);
        });
      });

      langButtons.forEach(function(btn){
        btn.addEventListener('click',function(){
          langButtons.forEach(function(b){b.classList.remove('active');});
          this.classList.add('active');
          currentLang=this.getAttribute('data-lang');
          renderImages(currentCode,currentLang);
        });
      });

      renderImages(currentCode,currentLang);
    })();
  </script>

</body>
